<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticky Notes</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Sticky Notes</h1>
      <button id="btn-refresh" class="link" title="Recount notes">Refresh</button>
    </header>

    <p id="msg" class="msg" aria-live="polite"></p>

    <section id="confirm" class="confirm" hidden>
      <p id="confirm-text">Delete all notes?</p>
      <div class="row">
        <button id="btn-confirm-no">Cancel</button>
        <button id="btn-confirm-yes" class="danger">Delete</button>
      </div>
    </section>

    <div class="grid">
      <button id="btn-add" class="primary">Add Note</button>
      <button id="btn-toggle-done">Toggle Done</button>
      <button id="btn-deldone">Delete Done</button>
      <button id="btn-prev">Previous</button>
      <button id="btn-next">Next</button>
      <button id="btn-del">Delete</button>
      <button id="btn-delall">Delete All</button>
      <button id="btn-hide">Hide All</button>
      <button id="btn-show">Show All</button>
    </div>

    <section class="progress" aria-label="Progress">
      <p class="progress-text"><span id="progress-label">Counting…</span> <span id="hidden-count" class="muted"></span></p>
      <div class="bar"><div id="progress-fill" class="bar-fill"></div></div>
    </section>

    <details id="notes-list" class="notes-list" open>
      <summary id="list-summary">Notes</summary>
      <div id="open-items"></div>
      <details id="done-list" class="done-list" hidden>
        <summary id="done-summary">Done</summary>
        <div id="done-items"></div>
      </details>
    </details>

    <details class="settings">
      <summary>Settings</summary>

      <h2 class="group">New Notes</h2>
      <p class="label">Position</p>
      <div class="seg" role="group" aria-label="New note position">
        <button data-position="tl">Top Left</button>
        <button data-position="tc">Top Center</button>
        <button data-position="tr">Top Right</button>
      </div>

      <p class="label">Color</p>
      <div class="swatches" role="group" aria-label="New note color">
        <button data-color="yellow" aria-label="Yellow"></button>
        <button data-color="pink" aria-label="Pink"></button>
        <button data-color="blue" aria-label="Blue"></button>
        <button data-color="green" aria-label="Green"></button>
        <button data-color="orange" aria-label="Orange"></button>
        <button data-color="purple" aria-label="Purple"></button>
      </div>
      <button id="btn-recolor" class="link small"><span id="recolor-label">Apply Yellow to All Notes</span></button>

      <label class="label" for="prefix">Prefix (e.g., Your Initials)</label>
      <input id="prefix" type="text" placeholder="e.g., FL:" autocomplete="off">

      <h2 class="group">Done</h2>
      <p class="label">Done Stamp</p>
      <label class="switch"><input id="stamp-on" type="checkbox"> Add a stamp when marking done</label>
      <div class="indent">
        <label class="label" for="who">Who (e.g., Your Initials)</label>
        <input id="who" type="text" placeholder="e.g., FL" autocomplete="off">
        <p id="stamp-preview" class="hint tight">Off</p>
      </div>

      <p class="label">Done Navigation</p>
      <label class="switch"><input id="skip-done" type="checkbox" checked> Skip Done Notes</label>
      <p class="hint tight">Previous / Next jump only to open notes.</p>

      <p class="hint">Settings are saved for you on this device.</p>
    </details>

    <p id="version" class="version"></p>
  </main>
  <script src="notes.js"></script>
</body>
</html>
